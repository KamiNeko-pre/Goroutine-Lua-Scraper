app:
    port: 8080
    lua_path: "./scripts/hackernews_collection.lua"
    proxy: ""
    pprof_port: 0

mysql:
    # Set LUA_SPIDER_MYSQL_DSN in the local environment before starting.
    dsn: ""
    max_idle_conns: 10
    max_open_conns: 100

redis:
    addr: "127.0.0.1:6379"
    password: ""
    db: 0
    stream: "crawler:tasks"
    consumer_group: "crawler-workers"

publisher:
    batch_size: 100
    poll_interval_ms: 1000
    batch_timeout_seconds: 10

cron:
    spec: "@every 1m"

engine:
    worker_count: 15
    task_queue_size: 1000
    lua_timeout: 30
    http_timeout_direct: 5
    http_timeout_proxy: 15

crawler:
    request_delay_min: 500
    request_delay_max: 3000
    max_fission_depth: 2
    max_fission_urls: 20
